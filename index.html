<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kanban Board | 互動式看板</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="app-header">
    <div class="header-left">
      <div class="logo-icon">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="3" />
          <path d="M9 3v18" />
          <path d="M15 3v18" />
        </svg>
      </div>
      <div>
        <h1 class="app-title">Kanban Flow</h1>
        <p class="app-subtitle">拖曳卡片以管理任務進度</p>
      </div>
    </div>
    <div class="header-actions">
      <button id="open-modal-btn" class="btn btn-primary">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
        新增任務
      </button>
      <button id="clear-done-btn" class="btn btn-outline" title="清除所有已完成的任務">
        清除已完成
      </button>
    </div>
  </header>

  <main class="board-container">
    <!-- 待處理欄位 -->
    <section class="column" data-status="todo">
      <div class="column-header">
        <div class="column-title-wrap">
          <span class="status-indicator todo"></span>
          <h2 class="column-title">待處理</h2>
        </div>
        <span class="badge" id="count-todo">0</span>
      </div>
      <div class="task-list" id="list-todo"></div>
      <button class="quick-add-btn" data-status="todo">
        ＋ 新增待處理卡片
      </button>
    </section>

    <!-- 進行中欄位 -->
    <section class="column" data-status="in-progress">
      <div class="column-header">
        <div class="column-title-wrap">
          <span class="status-indicator in-progress"></span>
          <h2 class="column-title">進行中</h2>
        </div>
        <span class="badge" id="count-in-progress">0</span>
      </div>
      <div class="task-list" id="list-in-progress"></div>
      <button class="quick-add-btn" data-status="in-progress">
        ＋ 新增進行中卡片
      </button>
    </section>

    <!-- 已完成欄位 -->
    <section class="column" data-status="done">
      <div class="column-header">
        <div class="column-title-wrap">
          <span class="status-indicator done"></span>
          <h2 class="column-title">已完成</h2>
        </div>
        <span class="badge" id="count-done">0</span>
      </div>
      <div class="task-list" id="list-done"></div>
      <button class="quick-add-btn" data-status="done">
        ＋ 新增已完成卡片
      </button>
    </section>
  </main>

  <!-- 新增/編輯任務彈窗 -->
  <div id="task-modal" class="modal-backdrop hidden">
    <div class="modal">
      <div class="modal-header">
        <h3 id="modal-title">新增任務</h3>
        <button id="close-modal-btn" class="icon-btn">&times;</button>
      </div>
      <form id="task-form">
        <input type="hidden" id="task-id" />
        <div class="form-group">
          <label for="task-title-input">任務名稱 <span class="required">*</span></label>
          <input type="text" id="task-title-input" placeholder="例如：完成登入功能切版" required maxlength="80" />
        </div>

        <div class="form-group">
          <label for="task-desc-input">任務備註 / 細節</label>
          <textarea id="task-desc-input" rows="3" placeholder="補充細節或相關注意事項..."></textarea>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="task-status-select">所屬看板欄位</label>
            <select id="task-status-select">
              <option value="todo">📋 待處理</option>
              <option value="in-progress">⚡ 進行中</option>
              <option value="done">✅ 已完成</option>
            </select>
          </div>

          <div class="form-group">
            <label for="task-priority-select">優先程度</label>
            <select id="task-priority-select">
              <option value="medium">🟡 中優先級</option>
              <option value="high">🔴 高優先級</option>
              <option value="low">🟢 低優先級</option>
            </select>
          </div>
        </div>

        <div class="modal-footer">
          <button type="button" id="cancel-btn" class="btn btn-outline">取消</button>
          <button type="submit" class="btn btn-primary">儲存任務</button>
        </div>
      </form>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
